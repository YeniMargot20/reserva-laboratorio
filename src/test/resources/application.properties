# Configuración exclusiva de las pruebas: usa H2 en memoria,
# no necesita MySQL ni el archivo .env.
spring.application.name=reserva-laboratorio

spring.datasource.url=jdbc:h2:mem:reservas_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Clave de prueba (no se usa fuera de los tests)
app.jwt.secret=dGVzdC1zZWNyZXQtcGFyYS1wcnVlYmFzLWF1dG9tYXRpY2FzLTEyMzQ1Njc4OTA=
app.jwt.issuer=reserva-laboratorio
app.jwt.expiration-seconds=900

app.bootstrap.enabled=true
BOOTSTRAP_ADMIN_EMAIL=admin@test.local
BOOTSTRAP_ADMIN_PASSWORD=AdminPrueba2026!
