spring.application.name=reserva-laboratorio
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:330/reserva_laboratorio_db}
spring.datasource.username=${DB_USERNAME:reserva_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuración de los tokens JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=reserva-laboratorio
app.jwt.expiration-seconds=900